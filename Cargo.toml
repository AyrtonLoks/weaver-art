[workspace]
resolver = "2"
members = [
  "crates/weaver-domain",
  "crates/weaver-dsp",
  "crates/weaver-solvers",
  "crates/weaver-cam",
  "crates/weaver-wasm-adapter",
  "crates/weaver-cli",
]
exclude = [
  "packages/wasm/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/weaver-art/weaver-art"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
