[package]
name = "weaver-wasm-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Camada 3 (Wasm Adapter): Ponte wasm-bindgen e SharedArrayBuffer RingBuffer."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
weaver-domain = { path = "../weaver-domain" }
weaver-dsp = { path = "../weaver-dsp" }
weaver-solvers = { path = "../weaver-solvers" }
weaver-cam = { path = "../weaver-cam" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"


